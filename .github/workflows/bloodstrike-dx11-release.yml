name: Blood Strike DX11 Extreme Mip

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "OptiScaler/Config.h"
      - "OptiScaler/Config.cpp"
      - "OptiScaler/hooks/Sampler_Overrides.h"
      - "OptiScaler/hooks/D3D11_Hooks.cpp"
      - "OptiScaler.ini"
      - ".github/workflows/bloodstrike-dx11-release.yml"
  push:
    branches: [ "master", "bloodstrike-dx11-extreme-mip", "bloodstrike-dx11-srv-mip-v2" ]
    paths:
      - "OptiScaler/Config.h"
      - "OptiScaler/Config.cpp"
      - "OptiScaler/hooks/Sampler_Overrides.h"
      - "OptiScaler/hooks/D3D11_Hooks.cpp"
      - "OptiScaler.ini"
      - ".github/workflows/bloodstrike-dx11-release.yml"

permissions:
  contents: write

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
  ARCHIVE_NAME: OptiScaler-BloodStrike-DX11-ExtremeMip-v2.7z

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: "true"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build unsigned Release
        shell: pwsh
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }} /verbosity:minimal

      - name: Prepare Blood Strike DX11 extreme mip preset
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "x64\Release\a"
          if (-not (Test-Path $output)) {
            throw "Build output folder not found: $output"
          }

          $ini = Get-Content (Join-Path $env:GITHUB_WORKSPACE "OptiScaler.ini") -Raw
          $ini = $ini -replace '(?m)^MipmapBiasOverride=auto$', 'MipmapBiasOverride=15.0'
          $ini = $ini -replace '(?m)^MipmapMinLODOverride=auto$', 'MipmapMinLODOverride=auto'
          $ini = $ini -replace '(?m)^MipmapSRVForceCoarsest=auto$', 'MipmapSRVForceCoarsest=true'
          $ini = $ini -replace '(?m)^MipmapBiasFixedOverride=auto$', 'MipmapBiasFixedOverride=true'
          $ini = $ini -replace '(?m)^MipmapBiasScaleOverride=auto$', 'MipmapBiasScaleOverride=false'
          $ini = $ini -replace '(?m)^MipmapBiasOverrideAll=auto$', 'MipmapBiasOverrideAll=true'
          $ini = $ini -replace '(?m)^CheckForUpdate=auto$', 'CheckForUpdate=false'
          Set-Content -Path (Join-Path $output "OptiScaler.ini") -Value $ini -Encoding UTF8

          @"
          OptiScaler Blood Strike DX11 Extreme Mip v2

          Preset:
          - MipmapBiasOverride=15.0
          - MipmapSRVForceCoarsest=true
          - MipmapMinLODOverride=auto
          - MipmapBiasFixedOverride=true
          - MipmapBiasScaleOverride=false
          - MipmapBiasOverrideAll=true

          v2 forces eligible DX11 shader-resource views to expose only the coarsest mip.
          This targets explicit-LOD texture sampling paths that can look unchanged with sampler bias alone.

          Intended target: Direct3D 11.
          No anti-cheat bypass or evasion code is included.
          "@ | Set-Content -Path (Join-Path $output "BLOODSTRIKE-DX11-EXTREME-MIP.txt") -Encoding UTF8

      - name: Compress package
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "x64\Release\a"
          $archive = Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE_NAME
          7z a -t7z $archive "$output\*"
          if (-not (Test-Path $archive)) {
            throw "Archive was not created"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: OptiScaler-BloodStrike-DX11-ExtremeMip-v2
          path: ${{ github.workspace }}\${{ env.ARCHIVE_NAME }}
          archive: false
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[bloodstrike-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bloodstrike-dx11-extreme-mip-v2
          name: OptiScaler Blood Strike DX11 Extreme Mip v2
          prerelease: false
          make_latest: true
          body: |
            Custom OptiScaler build focused on Blood Strike / Direct3D 11.

            v2 preset:
            - Mip LOD bias: +15
            - Force eligible DX11 SRVs to expose only their coarsest mip: enabled
            - Fixed bias: enabled
            - Override all sampler bias: enabled

            v2 changes the mechanism after testing showed MinLOD=15 could look identical to +15 bias.
            The SRV override also affects textures sampled through explicit LOD paths.
            No anti-cheat bypass or evasion is included.
          files: ${{ github.workspace }}\${{ env.ARCHIVE_NAME }}
